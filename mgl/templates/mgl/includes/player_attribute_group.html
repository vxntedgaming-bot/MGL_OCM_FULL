{% if items %}
<section class="mgl-attr-group">
    <h3>{{ title }}</h3>
    <div class="mgl-attr-rows">
        {% for item in items %}
            <div class="mgl-attr-row">
                <span>{{ item.label }}</span>
                <strong>{{ item.value }}</strong>
            </div>
        {% endfor %}
    </div>
</section>
{% endif %}
