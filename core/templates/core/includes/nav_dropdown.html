<div class="mgl-nav-dropdown" data-nav-dropdown="{{ menu.id }}">
    <button
        type="button"
        class="mgl-nav-trigger {% if menu.is_current %}is-active{% endif %}"
        data-nav-trigger
        aria-expanded="false"
        aria-haspopup="true"
        aria-controls="mgl-nav-menu-{{ menu.id }}"
        id="mgl-nav-trigger-{{ menu.id }}"
    >
        <span>{{ menu.label }}</span>
        {% if menu.badge %}<span class="mgl-nav-badge is-count">{{ menu.badge }}</span>{% endif %}
        <span class="mgl-nav-chevron" aria-hidden="true">
            <svg viewBox="0 0 12 8" focusable="false">
                <path d="M1 1.5 L6 6.5 L11 1.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
        </span>
    </button>
    <div class="mgl-nav-menu" id="mgl-nav-menu-{{ menu.id }}" role="menu" aria-labelledby="mgl-nav-trigger-{{ menu.id }}" aria-hidden="true">
        {% for item in menu.items %}
            {% if item.heading %}
                <p class="mgl-nav-heading{% if item.divider %} has-divider{% endif %}" role="presentation">{{ item.label }}</p>
            {% else %}
                <a
                    href="{{ item.url }}"
                    class="mgl-nav-item{% if item.style %} mgl-nav-item--{{ item.style }}{% endif %}{% if item.is_current %} is-current{% endif %}{% if item.divider %} has-divider{% endif %}"
                    role="menuitem"
                >
                    <span class="mgl-nav-item-label">{% if item.style == "sub" %}<span class="mgl-nav-dash">—</span> {% endif %}{{ item.label }}</span>
                    {% if item.badge %}<span class="mgl-nav-badge{% if item.badge_class %} {{ item.badge_class }}{% endif %}">{{ item.badge }}</span>{% endif %}
                </a>
            {% endif %}
        {% endfor %}
    </div>
</div>
