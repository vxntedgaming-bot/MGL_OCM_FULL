{% load static %}
<section class="uh-connect" id="ufl-fc" aria-labelledby="uh-connect-title">
    <p class="uh-kicker">HOW UFL CONNECTS TO EA FC</p>
    <h2 id="uh-connect-title">ONE CLUB. TWO EXPERIENCES.</h2>
    <p class="uh-copy">YOUR CLUB. Your UFL squad is the blueprint. Build it inside EA FC, play your fixtures, then bring the result back to UFL.</p>
    <div class="uh-split">
        <figure class="uh-board">
            <b>UFL / WEBSITE</b>
            <div class="uh-pitch" aria-hidden="true">
                <span class="uh-dot" style="left:50%;top:12%"></span>
                <span class="uh-dot" style="left:22%;top:32%"></span>
                <span class="uh-dot" style="left:40%;top:30%"></span>
                <span class="uh-dot" style="left:60%;top:30%"></span>
                <span class="uh-dot" style="left:78%;top:32%"></span>
                <span class="uh-dot" style="left:34%;top:52%"></span>
                <span class="uh-dot" style="left:66%;top:52%"></span>
                <span class="uh-dot" style="left:22%;top:70%"></span>
                <span class="uh-dot" style="left:50%;top:68%"></span>
                <span class="uh-dot" style="left:78%;top:70%"></span>
                <span class="uh-dot" style="left:50%;top:86%"></span>
            </div>
            <figcaption>
                <strong>SQUAD BOARD</strong>
                <span>Formation 4-2-3-1</span>
                <span>Player positions</span>
                <span>OVR —</span>
                <span>Squad value —</span>
                <span>—</span>
                <span>Chemistry —</span>
            </figcaption>
        </figure>
        <figure>
            <b>EA FC / IN-GAME</b>
            <img src="{% static 'core/img/ufl-home-match.jpg' %}" alt="EA FC match on the pitch">
        </figure>
    </div>
</section>
