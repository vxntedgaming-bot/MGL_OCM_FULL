<div class="ufl-ticker" role="region" aria-label="Latest news" data-ufl-ticker-root>
    <div class="ufl-ticker-inner">
        <strong class="ufl-ticker-label">📰 LATEST NEWS</strong>
        <span class="visually-hidden">UFL LIVE ACTIVITY</span>
        <div class="ufl-ticker-viewport" data-ufl-ticker>
            {% if mgl_live_items %}
                {% for item in mgl_live_items %}
                    <a href="{{ item.url }}" class="ufl-ticker-item{% if forloop.first %} is-active{% endif %}">{{ item.title }}</a>
                {% endfor %}
            {% else %}
                <p class="ufl-ticker-item ufl-ticker-empty is-active">No latest news available</p>
            {% endif %}
        </div>
        <a href="{% url 'live_activity' %}" class="ufl-ticker-all">ALL ACTIVITY →</a>
    </div>
</div>
