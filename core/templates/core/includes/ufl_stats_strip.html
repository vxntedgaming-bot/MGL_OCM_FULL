<section class="uh-stats" aria-label="Live UFL summary">
    <div>
        <strong>{{ manager_count }}</strong>
        <span>ACTIVE MANAGERS</span>
    </div>
    <div>
        <strong>{{ matches_played }}</strong>
        <span>MATCHES PLAYED</span>
    </div>
    <div>
        <strong>{{ configured_club_total }}</strong>
        <span>ACTIVE CLUBS</span>
    </div>
    <div>
        <strong>SEASON {{ current_season_number }}</strong>
        <span>CURRENT SEASON</span>
    </div>
    <p class="uh-divisions">
        <a href="{% url 'competition_page' 'premier-league' %}">Premier League</a>
        <span aria-hidden="true">·</span>
        <a href="{% url 'competition_page' 'championship' %}">Championship</a>
        <span aria-hidden="true">·</span>
        <a href="{% url 'competition_page' 'league-one' %}">League One</a>
    </p>
</section>
